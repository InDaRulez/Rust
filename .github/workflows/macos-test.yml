name: macOS test build
on:
  push:
    branches: [main, astral-macos-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            crates/astral-core -> target
          cache-on-failure: true
      - name: Install frontend dependencies
        run: npm ci
      - name: Test Rust core
        run: npm run test:rust
      - name: Build universal macOS application
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg --config '{"bundle":{"macOS":{"signingIdentity":"-","minimumSystemVersion":"11.0"}}}'
      - name: Verify universal executable and signature
        run: |
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/Astral.app
          ditto -c -k --sequesterRsrc --keepParent "$APP" Astral-mac-universal.zip
          lipo "$APP/Contents/MacOS/astral" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Verify application starts on macOS
        run: |
          python3 - <<'PYTEST'
          import subprocess, time
          binary = 'src-tauri/target/universal-apple-darwin/release/bundle/macos/Astral.app/Contents/MacOS/astral'
          with open('macos-startup.log', 'w') as log:
              app = subprocess.Popen([binary], stdout=log, stderr=subprocess.STDOUT)
              try:
                  time.sleep(8)
                  if app.poll() is not None:
                      raise RuntimeError('Astral exited during startup: ' + str(app.returncode))
                  print('Astral remained running during the startup smoke test.')
              finally:
                  if app.poll() is None:
                      app.terminate()
                      try:
                          app.wait(timeout=10)
                      except subprocess.TimeoutExpired:
                          app.kill()
                          app.wait()
          PYTEST
      - name: Upload test application
        if: ${{ !cancelled() && hashFiles('Astral-mac-universal.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Astral-mac-universal
          retention-days: 14
          if-no-files-found: error
          path: |
            Astral-mac-universal.zip
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
